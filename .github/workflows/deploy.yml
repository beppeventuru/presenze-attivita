name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica i file statici
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4

